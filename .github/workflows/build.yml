name: APK Builder Engine
run-name: build-${{ github.event.inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build ID'
        required: true
      type:
        description: 'Build Format'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 1. Initializing Build Environment
        uses: actions/checkout@v4

      - name: 2. Validating Application Settings
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Preparing Android Project
        run: |
          mkdir -p workspace
          cp builds/${{ github.event.inputs.build_id }}/config.json workspace/config.json || true
          cp builds/${{ github.event.inputs.build_id }}/icon.png workspace/icon.png || true
          cp builds/${{ github.event.inputs.build_id }}/splash.png workspace/splash.png || true

          cd workspace
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cat << 'EOF' > generate_base.py
          import json, os, sys
          if not os.path.exists('config.json'):
              print("No config.json found")
              sys.exit(1)
          with open('config.json') as f: cfg = json.load(f)
          a = cfg['app']
          pkg = a['package']
          min_sdk = max(21, int(a.get('min_sdk', 21)))
          target_sdk = max(36, int(a.get('target_sdk', 36)))   # Google Play requires API 36+

          with open("settings.gradle", "w") as f:
              f.write("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n")
              f.write("dependencyResolutionManagement { repositories { google(); mavenCentral() } }\n")
              f.write("rootProject.name='webapp'\ninclude ':app'\n")

          with open("build.gradle", "w") as f:
              f.write("plugins { id 'com.android.application' version '8.9.1' apply false }\n")

          with open("gradle.properties", "w") as f:
              f.write("org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8\n")
              f.write("android.useAndroidX=true\n")
              f.write("android.nonTransitiveRClass=true\n")
              f.write("android.suppressUnsupportedCompileSdk=36\n")

          lines = [
              "plugins {",
              "    id 'com.android.application'",
              "}",
              "",
              "android {",
              "    namespace '%s'" % pkg,
              "    compileSdk 36",
              "",
              "    defaultConfig {",
              "        applicationId '%s'" % pkg,
              "        minSdk %d" % min_sdk,
              "        targetSdk %d" % target_sdk,
              "        versionCode %d" % int(a['version_code']),
              "        versionName '%s'" % a['version_name'],
              "    }",
              "",
              "    signingConfigs {",
              "        permanent {",
              "            if (System.getenv('KEYSTORE_PATH')) {",
              "                storeFile file(System.getenv('KEYSTORE_PATH'))",
              "                storePassword System.getenv('KEYSTORE_PASSWORD')",
              "                keyAlias System.getenv('KEY_ALIAS')",
              "                keyPassword System.getenv('KEY_PASSWORD')",
              "            }",
              "        }",
              "    }",
              "",
              "    buildTypes {",
              "        release {",
              "            minifyEnabled false",
              "            signingConfig System.getenv('KEYSTORE_PATH') ? signingConfigs.permanent : signingConfigs.debug",
              "        }",
              "        debug {",
              "            signingConfig System.getenv('KEYSTORE_PATH') ? signingConfigs.permanent : signingConfigs.debug",
              "        }",
              "    }",
              "",
              "    lint {",
              "        abortOnError false",
              "        checkReleaseBuilds false",
              "    }",
              "",
              "    compileOptions {",
              "        sourceCompatibility JavaVersion.VERSION_17",
              "        targetCompatibility JavaVersion.VERSION_17",
              "    }",
              "}",
              "",
              "dependencies {",
              "    implementation 'androidx.appcompat:appcompat:1.6.1'",
              "    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'",
              "}",
              "",
          ]
          with open("app/build.gradle", "w") as f:
              f.write("\n".join(lines))
          EOF
          python3 generate_base.py

          # Generate Gradle wrapper (8.11.1 is the minimum for AGP 8.9.1, needed for API 36)
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x ./gradlew

      - name: 4. Processing App Icon & Splash Screen
        working-directory: workspace
        run: |
          pip install pillow -q --break-system-packages || pip install pillow -q || true
          cat << 'EOF' > icon_splash.py
          import json, os, shutil
          try:
              from PIL import Image
          except Exception:
              Image = None

          with open('config.json') as f: cfg = json.load(f)
          assets = 'app/src/main/assets'
          os.makedirs(assets, exist_ok=True)

          # splash page (HTML) shown on app start
          with open(assets + '/splash.html', 'w', encoding='utf-8') as f:
              f.write(cfg['app']['loader']['html'])

          def save_png(src, dst, max_side):
              ok = False
              if Image:
                  try:
                      im = Image.open(src).convert('RGBA')
                      im.thumbnail((max_side, max_side))
                      im.save(dst, 'PNG')
                      ok = True
                  except Exception as e:
                      print('Image convert failed:', src, e)
              if not ok:
                  shutil.copy(src, dst)

          # ---- app (launcher) icon ----
          dst = 'app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'
          if os.path.exists('icon.png'):
              os.makedirs('app/src/main/res/mipmap-xxxhdpi', exist_ok=True)
              save_png('icon.png', dst, 512)
              # splash.html loads icon.png from assets
              shutil.copy(dst, assets + '/icon.png')
          else:
              os.makedirs('app/src/main/res/drawable', exist_ok=True)
              color = cfg['app'].get('theme_color', '#0d9488')
              with open('app/src/main/res/drawable/ic_launcher.xml', 'w') as f:
                  f.write('<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="' + color + '"/><corners android:radius="24dp"/></shape>')

          # ---- optional splash image (splash.html loads splash_img.png from assets) ----
          if os.path.exists('splash.png'):
              save_png('splash.png', assets + '/splash_img.png', 1280)
          EOF
          python3 icon_splash.py
          ls -la app/src/main/assets

      - name: 5. Configuring Android Permissions
        working-directory: workspace
        run: |
          cat << 'EOF' > gen_code.py
          import json, os
          with open('config.json') as f: cfg = json.load(f)
          app = cfg['app']
          pkg = app['package']

          perms = ['INTERNET', 'ACCESS_NETWORK_STATE']
          pm_map = {'camera':['CAMERA'],'location':['ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION'],'storage':['READ_EXTERNAL_STORAGE','READ_MEDIA_IMAGES'],'mic':['RECORD_AUDIO','MODIFY_AUDIO_SETTINGS'],'notifications':['POST_NOTIFICATIONS']}
          for p in app.get('permissions', []): perms.extend(pm_map.get(p, []))
          pm_str = ''.join([f'<uses-permission android:name="android.permission.{p}"/>' for p in perms])
          rt_str = ','.join([f'"android.permission.{p}"' for p in perms])
          ori = {'auto':'unspecified','portrait':'portrait','landscape':'landscape'}.get(app.get('orientation', 'auto'), 'unspecified')

          icon_attr = '@mipmap/ic_launcher' if os.path.exists('app/src/main/res/mipmap-xxxhdpi/ic_launcher.png') else '@drawable/ic_launcher'

          with open('app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(f'<manifest xmlns:android="http://schemas.android.com/apk/res/android">{pm_str}<application android:label="@string/app_name" android:icon="{icon_attr}" android:theme="@style/AppTheme" android:usesCleartextTraffic="true"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="{ori}" android:windowSoftInputMode="adjustResize" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><provider android:name=\"androidx.core.content.FileProvider\" android:authorities=\"{pkg}.fileprovider\" android:exported=\"false\" android:grantUriPermissions=\"true\"><meta-data android:name=\"android.support.FILE_PROVIDER_PATHS\" android:resource=\"@xml/file_paths\"/></provider></application></manifest>')

          # escape characters that break Android strings.xml (apostrophe, quotes, &, <, @, ?)
          nm = app["name"].replace("&", "&amp;").replace("<", "&lt;").replace("'", "\\'").replace('"', '\\"')
          if nm.startswith('@') or nm.startswith('?'): nm = '\\' + nm
          with open('app/src/main/res/values/strings.xml', 'w') as f:
              f.write(f'<resources><string name="app_name">{nm}</string></resources>')
          with open('app/src/main/res/values/themes.xml', 'w') as f:
              f.write(f'<resources><style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:statusBarColor">{app["theme_color"]}</item><item name="android:navigationBarColor">{app.get("nav_color","#ffffff")}</item><item name="android:windowBackground">{app["splash_color"]}</item></style></resources>')
          os.makedirs('app/src/main/res/xml', exist_ok=True)
          with open('app/src/main/res/xml/file_paths.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?><paths><external-files-path name="dl" path="."/><files-path name="fp" path="."/><cache-path name="cp" path="."/></paths>')

          cs = app.get('custom', {})
          jstr = lambda s: json.dumps(s)
          java_code = """package @@PKG@@;
          import android.annotation.SuppressLint;import android.content.Intent;import android.graphics.Color;import android.net.Uri;import android.os.*;import android.view.*;import android.webkit.*;import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import android.content.ContentValues;import android.provider.MediaStore;import android.util.Base64;import android.app.DownloadManager;import android.print.PrintAttributes;import android.print.PrintManager;import androidx.core.content.FileProvider;import org.json.JSONObject;import java.io.File;import java.io.FileOutputStream;import java.io.IOException;import java.io.OutputStream;
          public class MainActivity extends AppCompatActivity{
           static final String THEME=@@THEME@@;static final String START=@@START@@;static final String OFFLINE=@@OFF@@;static final String UA=@@UA@@;static final boolean EXT=@@EXT@@;
           WebView web;WebView splash;SwipeRefreshLayout sw;TextView off;ValueCallback<Uri[]> cb;
           volatile boolean trusted=false;WebView printWeb;
           @SuppressLint("SetJavaScriptEnabled") @Override protected void onCreate(Bundle b){
            super.onCreate(b);
            if(@@FULL@@){getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,WindowManager.LayoutParams.FLAG_FULLSCREEN);
             if(Build.VERSION.SDK_INT>=28){WindowManager.LayoutParams lp=getWindow().getAttributes();lp.layoutInDisplayCutoutMode=WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;getWindow().setAttributes(lp);}
             getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_STABLE|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);}
            FrameLayout root=new FrameLayout(this);sw=new SwipeRefreshLayout(this);web=new WebView(this);sw.addView(web,new ViewGroup.LayoutParams(-1,-1));root.addView(sw,new FrameLayout.LayoutParams(-1,-1));
            sw.setEnabled(@@PULL@@);sw.setOnRefreshListener(()->{off.setVisibility(View.GONE);web.reload();});sw.setOnChildScrollUpCallback((p,c)->web.getScrollY()>0);
            off=new TextView(this);off.setText(OFFLINE);off.setGravity(Gravity.CENTER);off.setPadding(60,60,60,60);off.setTextSize(17);off.setBackgroundColor(Color.WHITE);off.setTextColor(Color.DKGRAY);off.setVisibility(View.GONE);
            off.setOnClickListener(v->{off.setVisibility(View.GONE);web.reload();});root.addView(off);
            splash=new WebView(this);splash.getSettings().setJavaScriptEnabled(false);splash.setBackgroundColor(Color.TRANSPARENT);splash.loadUrl("file:///android_asset/splash.html");root.addView(splash);
            setContentView(root);root.setBackgroundColor(Color.parseColor(THEME));
            androidx.core.view.ViewCompat.setOnApplyWindowInsetsListener(root,(vw,ins)->{androidx.core.graphics.Insets bb=ins.getInsets(androidx.core.view.WindowInsetsCompat.Type.systemBars()|androidx.core.view.WindowInsetsCompat.Type.ime());vw.setPadding(bb.left,bb.top,bb.right,bb.bottom);return androidx.core.view.WindowInsetsCompat.CONSUMED;});
            getOnBackPressedDispatcher().addCallback(this,new androidx.activity.OnBackPressedCallback(true){@Override public void handleOnBackPressed(){if(web.canGoBack())web.goBack();else{setEnabled(false);getOnBackPressedDispatcher().onBackPressed();}}});
            WebSettings s=web.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setMediaPlaybackRequiresUserGesture(false);s.setGeolocationEnabled(true);s.setAllowFileAccess(false);s.setDatabaseEnabled(true);s.setTextZoom(100);s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);s.setJavaScriptCanOpenWindowsAutomatically(true);
            if((getApplicationInfo().flags&android.content.pm.ApplicationInfo.FLAG_DEBUGGABLE)!=0)WebView.setWebContentsDebuggingEnabled(true);
            if(UA.length()>0)s.setUserAgentString(s.getUserAgentString()+" "+UA);
            if(@@ZOOM@@){s.setSupportZoom(true);s.setBuiltInZoomControls(true);s.setDisplayZoomControls(false);}
            CookieManager.getInstance().setAcceptCookie(true);CookieManager.getInstance().setAcceptThirdPartyCookies(web,true);
            web.setWebViewClient(new WebViewClient(){
             @Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){Uri u=r.getUrl();String sc=u.getScheme()==null?"":u.getScheme();
              if(sc.equals("http")||sc.equals("https")){if(EXT&&u.getHost()!=null&&!u.getHost().equals(Uri.parse(START).getHost())){try{startActivity(new Intent(Intent.ACTION_VIEW,u));}catch(Exception e){}return true;}return false;}
              try{startActivity(new Intent(Intent.ACTION_VIEW,u));}catch(Exception e){}return true;}
             @Override public void onPageStarted(WebView v,String u,android.graphics.Bitmap fv){try{String h=Uri.parse(u).getHost();trusted=h!=null&&h.equals(Uri.parse(START).getHost());}catch(Exception e){trusted=false;}}
             @Override public void onPageFinished(WebView v,String u){sw.setRefreshing(false);CookieManager.getInstance().flush();v.evaluateJavascript(\"window.print=function(){AndroidBridge.printPage()}\",null);}
             @Override public void onReceivedError(WebView v,WebResourceRequest r,WebResourceError e){if(r.isForMainFrame()){sw.setRefreshing(false);off.setVisibility(View.VISIBLE);}}
            });
            web.setWebChromeClient(new WebChromeClient(){
             @Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> c,FileChooserParams p){if(cb!=null)cb.onReceiveValue(null);cb=c;try{startActivityForResult(p.createIntent(),1);}catch(Exception e){cb=null;return false;}return true;}
             @Override public void onGeolocationPermissionsShowPrompt(String o,GeolocationPermissions.Callback c){c.invoke(o,true,false);}
             @Override public void onPermissionRequest(PermissionRequest r){runOnUiThread(()->r.grant(r.getResources()));}
             @Override public boolean onJsAlert(WebView v,String u,String m,JsResult r){new android.app.AlertDialog.Builder(MainActivity.this).setMessage(m).setPositiveButton(android.R.string.ok,(d,w)->r.confirm()).setOnCancelListener(d->r.cancel()).show();return true;}
             @Override public boolean onJsConfirm(WebView v,String u,String m,JsResult r){new android.app.AlertDialog.Builder(MainActivity.this).setMessage(m).setPositiveButton(android.R.string.ok,(d,w)->r.confirm()).setNegativeButton(android.R.string.cancel,(d,w)->r.cancel()).setOnCancelListener(d->r.cancel()).show();return true;}
            });
            web.setDownloadListener((u,ua,cd,mt,l)->handleDownload(u,ua,cd,mt));
            String[] P=new String[]{@@PERMS@@};if(Build.VERSION.SDK_INT>=23&&P.length>0)requestPermissions(P,2);
            web.addJavascriptInterface(new Bridge(),\"AndroidBridge\");
            root.getViewTreeObserver().addOnGlobalLayoutListener(new ViewTreeObserver.OnGlobalLayoutListener(){boolean d;@Override public void onGlobalLayout(){if(d||web.getHeight()<=0)return;d=true;root.getViewTreeObserver().removeOnGlobalLayoutListener(this);web.loadUrl(START);}});
            new Handler(Looper.getMainLooper()).postDelayed(()->splash.setVisibility(View.GONE),@@DUR@@);
           }
           class Bridge{
            @JavascriptInterface public void saveFile(String b64,String name,String mime){if(!trusted)return;try{doSave(Base64.decode(b64,Base64.DEFAULT),name,mime);}catch(Exception e){toast("ফাইল সেভ হয়নি");}}
            @JavascriptInterface public void printPage(){runOnUiThread(()->doPrint(web,"Report"));}
            @JavascriptInterface public void printHtml(String html,String job){if(!trusted)return;runOnUiThread(()->{try{printWeb=new WebView(MainActivity.this);printWeb.getSettings().setJavaScriptEnabled(false);printWeb.setWebViewClient(new WebViewClient(){@Override public void onPageFinished(WebView v,String u){doPrint(v,job);}});printWeb.loadDataWithBaseURL(null,html,"text/html","UTF-8",null);}catch(Exception e){toast("প্রিন্ট শুরু হয়নি");}});}
           }
           void toast(String m){runOnUiThread(()->Toast.makeText(this,m,Toast.LENGTH_LONG).show());}
           void doPrint(WebView w,String job){try{PrintManager pm=(PrintManager)getSystemService(PRINT_SERVICE);pm.print(job,w.createPrintDocumentAdapter(job),new PrintAttributes.Builder().setMediaSize(PrintAttributes.MediaSize.ISO_A4).build());}catch(Exception e){toast("প্রিন্ট শুরু করা যায়নি");}}
           String cleanName(String n){if(n==null||n.trim().length()==0)n="file";StringBuilder sb=new StringBuilder();for(int i=0;i<n.length()&&i<100;i++){char c=n.charAt(i);if(c=='/'||c==92||c==':'||c=='*'||c=='?'||c=='"'||c=='<'||c=='>'||c=='|'||c<32)c='_';sb.append(c);}String r=sb.toString().trim();if(r.startsWith("."))r="_"+r;return r;}
           void doSave(byte[] data,String name,String mime){
            try{
             name=cleanName(name);if(mime==null||mime.length()==0||mime.contains("android.package-archive"))mime="application/octet-stream";
             Uri uri;
             if(Build.VERSION.SDK_INT>=29){
              ContentValues cv=new ContentValues();cv.put(MediaStore.MediaColumns.DISPLAY_NAME,name);cv.put(MediaStore.MediaColumns.MIME_TYPE,mime);cv.put(MediaStore.MediaColumns.RELATIVE_PATH,Environment.DIRECTORY_DOWNLOADS);cv.put(MediaStore.MediaColumns.IS_PENDING,1);
              uri=getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI,cv);
              if(uri==null)throw new IOException("insert");
              OutputStream os=getContentResolver().openOutputStream(uri);os.write(data);os.close();
              cv.clear();cv.put(MediaStore.MediaColumns.IS_PENDING,0);getContentResolver().update(uri,cv,null,null);
             }else{
              File dir=getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);if(dir==null)dir=getFilesDir();dir.mkdirs();
              File f=new File(dir,name);FileOutputStream os=new FileOutputStream(f);os.write(data);os.close();
              uri=FileProvider.getUriForFile(this,getPackageName()+".fileprovider",f);
             }
             askOpen(uri,mime,name);
            }catch(Exception e){toast("ফাইল সেভ করা যায়নি");}
           }
           void askOpen(Uri uri,String mime,String name){runOnUiThread(()->{
            try{new android.app.AlertDialog.Builder(MainActivity.this).setTitle("ফাইল সেভ হয়েছে").setMessage(name)
             .setPositiveButton("খুলুন",(d,w)->{Intent i=new Intent(Intent.ACTION_VIEW);i.setDataAndType(uri,mime);i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_ACTIVITY_NEW_TASK);try{startActivity(i);}catch(Exception e){toast("এই ফাইল খোলার অ্যাপ নেই");}})
             .setNegativeButton("শেয়ার",(d,w)->{Intent i=new Intent(Intent.ACTION_SEND);i.setType(mime);i.putExtra(Intent.EXTRA_STREAM,uri);i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);try{startActivity(Intent.createChooser(i,name));}catch(Exception e){}})
             .setNeutralButton("ঠিক আছে",null).show();}catch(Exception e){}
           });}
           void handleDownload(String u,String ua,String cd,String mt){
            try{
             if(u.startsWith("blob:")){
              String q=JSONObject.quote(u),n=JSONObject.quote(URLUtil.guessFileName(u,cd,mt)),m=JSONObject.quote(mt==null?"":mt);
              web.evaluateJavascript("(async function(){try{var r=await fetch("+q+");var b=await r.blob();var f=new FileReader();f.onloadend=function(){AndroidBridge.saveFile(String(f.result).split(',')[1],"+n+","+m+"||b.type)};f.readAsDataURL(b);}catch(e){}})()",null);
              return;
             }
             if(u.startsWith("data:")){
              int c=u.indexOf(',');
              if(c>0&&trusted&&u.substring(0,c).contains(";base64")){String m=u.substring(5,c).split(";")[0];doSave(Base64.decode(Uri.decode(u.substring(c+1)),Base64.DEFAULT),cd!=null&&cd.length()>0?URLUtil.guessFileName(u,cd,mt):"download",m);}
              return;
             }
             if(u.startsWith("http")){
              String fn=URLUtil.guessFileName(u,cd,mt);
              DownloadManager.Request rq=new DownloadManager.Request(Uri.parse(u));
              String ck=CookieManager.getInstance().getCookie(u);if(ck!=null)rq.addRequestHeader("Cookie",ck);
              if(ua!=null)rq.addRequestHeader("User-Agent",ua);
              if(mt!=null&&mt.length()>0)rq.setMimeType(mt);
              rq.setTitle(fn);rq.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
              if(Build.VERSION.SDK_INT>=29)rq.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,fn);else rq.setDestinationInExternalFilesDir(this,Environment.DIRECTORY_DOWNLOADS,fn);
              ((DownloadManager)getSystemService(DOWNLOAD_SERVICE)).enqueue(rq);
              toast("ডাউনলোড শুরু হয়েছে");
             }
            }catch(Exception e){toast("ডাউনলোড করা যায়নি");}
           }
           @Override protected void onActivityResult(int rq,int rs,Intent d){if(rq==1&&cb!=null){cb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rs,d));cb=null;}else super.onActivityResult(rq,rs,d);}
           @Override protected void onPause(){CookieManager.getInstance().flush();super.onPause();}
           
          }"""
          java_code = java_code.replace('@@THEME@@', jstr(app['theme_color'])).replace('@@PKG@@', pkg).replace('@@START@@', jstr(app.get('start_url') or app['url']))
          java_code = java_code.replace('@@OFF@@', jstr(app.get('offline_msg') or 'No internet connection'))
          java_code = java_code.replace('@@UA@@', jstr(cs.get('user_agent', ''))).replace('@@EXT@@', 'true' if cs.get('external') else 'false')
          java_code = java_code.replace('@@FULL@@', 'true' if app.get('fullscreen') else 'false')
          java_code = java_code.replace('@@PULL@@', 'true' if app.get('pull_refresh') else 'false')
          java_code = java_code.replace('@@ZOOM@@', 'true' if cs.get('zoom') else 'false')
          java_code = java_code.replace('@@DUR@@', str(int(app['loader']['duration']) * 1000))
          java_code = java_code.replace('@@PERMS@@', rt_str)

          os.makedirs(f"app/src/main/java/{pkg.replace('.', '/')}", exist_ok=True)
          with open(f"app/src/main/java/{pkg.replace('.', '/')}/MainActivity.java", 'w', encoding='utf-8') as f:
              f.write(java_code)
          EOF
          python3 gen_code.py

      - name: 6. Compiling Android Resources
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 platforms;android-35 build-tools;36.0.0 build-tools;35.0.0'

      - name: 6b. Preparing Signing Key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KPASS: ${{ secrets.KEY_PASSWORD }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ -n "$KS_B64" ]; then
            # Option A: one shared key from GitHub Secrets
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$KS_ALIAS"
              echo "KEY_PASSWORD=${KS_KPASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
            echo "Using permanent signing key from Secrets"
          elif [ "$REPO_PRIVATE" != "true" ]; then
            echo "::warning::Repository is PUBLIC - refusing to store a signing key here. Using a temporary debug key (updates will not install over older builds)."
          else
            # Option B: one key per app (package), created automatically on its first build and stored in keys/
            PKG=$(python3 -c "import json;print(json.load(open('workspace/config.json'))['app']['package'])")
            mkdir -p keys
            if [ ! -f "keys/$PKG.jks" ]; then
              PASS=$(openssl rand -hex 16)
              echo "::add-mask::$PASS"
              keytool -genkeypair -keystore "keys/$PKG.jks" -alias app -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$PASS" -keypass "$PASS" -dname "CN=$PKG, O=App, C=BD"
              printf 'alias=app\npassword=%s\n' "$PASS" > "keys/$PKG.properties"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add "keys/$PKG.jks" "keys/$PKG.properties"
              git commit -m "Create signing key for $PKG"
              git pull --rebase || true
              git push
              echo "Created a NEW signing key for $PKG (keys/$PKG.jks)"
            else
              echo "Using saved signing key for $PKG"
            fi
            PASS=$(grep '^password=' "keys/$PKG.properties" | cut -d= -f2-)
            echo "::add-mask::$PASS"
            {
              echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keys/$PKG.jks"
              echo "KEYSTORE_PASSWORD=$PASS"
              echo "KEY_ALIAS=app"
              echo "KEY_PASSWORD=$PASS"
            } >> "$GITHUB_ENV"
          fi

      - name: 7. Running Gradle Build
        working-directory: workspace
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          B_MODE=$(python3 -c "import re;m=re.search(r'\"build_type\"\s*:\s*\"([^\"]*)\"',open('config.json').read());print(m.group(1).lower() if m else 'debug')" 2>/dev/null || echo "debug")
          if [ "$B_MODE" = "release" ]; then TARGET="Release"; else TARGET="Debug"; fi
          echo "Build mode: $TARGET"

          TYPE="${{ github.event.inputs.type }}"
          : > ../gradle.log
          FAILED=0

          if [ "$TYPE" = "apk" ] || [ "$TYPE" = "both" ]; then
            ./gradlew assemble$TARGET --no-daemon --stacktrace 2>&1 | tee -a ../gradle.log
            [ "${PIPESTATUS[0]}" -eq 0 ] || FAILED=1
          fi
          if [ $FAILED -eq 0 ] && { [ "$TYPE" = "aab" ] || [ "$TYPE" = "both" ]; }; then
            ./gradlew bundle$TARGET --no-daemon --stacktrace 2>&1 | tee -a ../gradle.log
            [ "${PIPESTATUS[0]}" -eq 0 ] || FAILED=1
          fi

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "=================== ERROR SUMMARY ==================="
            grep -n -E -A12 "What went wrong|error:|AAPT|Execution failed" ../gradle.log | head -80
            exit 1
          fi

      - name: 8. Generating APK / AAB
        working-directory: workspace
        run: |
          mkdir -p ../dist
          find app/build/outputs -type f -name "*.apk" -exec cp {} ../dist/ \; || true
          find app/build/outputs -type f -name "*.aab" -exec cp {} ../dist/ \; || true
          ls -la ../dist/

      - name: 9. Signing Application
        run: |
          for f in dist/*.apk; do
            [ -f "$f" ] && "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$f" | grep -E "SHA-256|Signer" || true
          done
          echo "Compare the SHA-256 above between builds: same value = users can update in place."

      - name: 10. Verifying Build Output
        run: |
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "Error: No APK or AAB files generated!"
            exit 1
          fi

      - name: 11. Preparing Download File
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.event.inputs.build_id }}
          name: Build #${{ github.event.inputs.build_id }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Temporary Files
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rf builds/${{ github.event.inputs.build_id }} || true
          git commit -m "Clean build #${{ github.event.inputs.build_id }}" || true
          git push || true
