name: APK Builder Engine
run-name: build-${{ github.event.inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build ID'
        required: true
      type:
        description: 'Build Format'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 1. Initializing Build Environment
        uses: actions/checkout@v4

      - name: 2. Validating Application Settings
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Preparing Android Project
        run: |
          mkdir -p workspace
          cp builds/${{ github.event.inputs.build_id }}/config.json workspace/config.json || true
          cp builds/${{ github.event.inputs.build_id }}/icon.png workspace/icon.png || true

          cd workspace
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cat << 'EOF' > generate_base.py
          import json, os, sys
          if not os.path.exists('config.json'):
              print("No config.json found")
              sys.exit(1)
          with open('config.json') as f: cfg = json.load(f)
          a = cfg['app']
          pkg = a['package']
          min_sdk = max(21, int(a.get('min_sdk', 21)))
          target_sdk = int(a.get('target_sdk', 34))

          with open("settings.gradle", "w") as f:
              f.write("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n")
              f.write("dependencyResolutionManagement { repositories { google(); mavenCentral() } }\n")
              f.write("rootProject.name='webapp'\ninclude ':app'\n")

          with open("build.gradle", "w") as f:
              f.write("plugins { id 'com.android.application' version '8.7.3' apply false }\n")

          with open("gradle.properties", "w") as f:
              f.write("org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8\n")
              f.write("android.useAndroidX=true\n")
              f.write("android.nonTransitiveRClass=true\n")
              f.write("android.suppressUnsupportedCompileSdk=36\n")

          lines = [
              "plugins {",
              "    id 'com.android.application'",
              "}",
              "",
              "def ksFile = file('../release.keystore')",
              "",
              "android {",
              "    namespace '%s'" % pkg,
              "    compileSdk 35",
              "",
              "    defaultConfig {",
              "        applicationId '%s'" % pkg,
              "        minSdk %d" % min_sdk,
              "        targetSdk %d" % target_sdk,
              "        versionCode %d" % int(a['version_code']),
              "        versionName '%s'" % a['version_name'],
              "    }",
              "",
              "    signingConfigs {",
              "        if (ksFile.exists()) {",
              "            release {",
              "                storeFile ksFile",
              "                storePassword System.getenv('KS_PASS')",
              "                keyAlias System.getenv('KS_ALIAS')",
              "                keyPassword System.getenv('KS_KEY_PASS')",
              "            }",
              "        }",
              "    }",
              "",
              "    buildTypes {",
              "        release {",
              "            minifyEnabled false",
              "            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug",
              "        }",
              "        debug {",
              "            if (ksFile.exists()) { signingConfig signingConfigs.release }",
              "        }",
              "    }",
              "",
              "    lint {",
              "        abortOnError false",
              "        checkReleaseBuilds false",
              "    }",
              "",
              "    compileOptions {",
              "        sourceCompatibility JavaVersion.VERSION_17",
              "        targetCompatibility JavaVersion.VERSION_17",
              "    }",
              "}",
              "",
              "dependencies {",
              "    implementation 'androidx.appcompat:appcompat:1.6.1'",
              "    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'",
              "}",
              "",
          ]
          with open("app/build.gradle", "w") as f:
              f.write("\n".join(lines))
          EOF
          python3 generate_base.py

          # Generate Gradle wrapper (8.9 works with AGP 8.7.3)
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x ./gradlew

      - name: 4. Processing App Icon & Splash Screen
        working-directory: workspace
        run: |
          pip install pillow -q || true
          cat << 'EOF' > icon_splash.py
          import json, os, shutil
          with open('config.json') as f: cfg = json.load(f)
          with open('app/src/main/assets/splash.html', 'w') as f:
              f.write(cfg['app']['loader']['html'])

          dst = 'app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'
          if os.path.exists('icon.png'):
              os.makedirs('app/src/main/res/mipmap-xxxhdpi', exist_ok=True)
              try:
                  # re-save as a real PNG (uploaded file may be JPG/WebP renamed to .png)
                  from PIL import Image
                  im = Image.open('icon.png').convert('RGBA')
                  im.thumbnail((512, 512))
                  im.save(dst, 'PNG')
              except Exception as e:
                  print('Icon conversion failed, using default icon:', e)
                  if os.path.exists(dst): os.remove(dst)

          if not os.path.exists(dst):
              os.makedirs('app/src/main/res/drawable', exist_ok=True)
              color = cfg['app'].get('theme_color', '#0d9488')
              with open('app/src/main/res/drawable/ic_launcher.xml', 'w') as f:
                  f.write('<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="' + color + '"/><corners android:radius="24dp"/></shape>')
          EOF
          python3 icon_splash.py

      - name: 5. Configuring Android Permissions
        working-directory: workspace
        run: |
          cat << 'EOF' > gen_code.py
          import json, os
          with open('config.json') as f: cfg = json.load(f)
          app = cfg['app']
          pkg = app['package']

          perms = ['INTERNET', 'ACCESS_NETWORK_STATE']
          pm_map = {'camera':['CAMERA'],'location':['ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION'],'storage':['READ_EXTERNAL_STORAGE','READ_MEDIA_IMAGES'],'mic':['RECORD_AUDIO','MODIFY_AUDIO_SETTINGS'],'notifications':['POST_NOTIFICATIONS']}
          for p in app.get('permissions', []): perms.extend(pm_map.get(p, []))
          pm_str = ''.join([f'<uses-permission android:name="android.permission.{p}"/>' for p in perms])
          pm_str += '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>'
          rt_str = ','.join([f'"android.permission.{p}"' for p in perms])
          ori = {'auto':'unspecified','portrait':'portrait','landscape':'landscape'}.get(app.get('orientation', 'auto'), 'unspecified')

          icon_attr = '@mipmap/ic_launcher' if os.path.exists('app/src/main/res/mipmap-xxxhdpi/ic_launcher.png') else '@drawable/ic_launcher'

          with open('app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(f'<manifest xmlns:android="http://schemas.android.com/apk/res/android">{pm_str}<application android:label="@string/app_name" android:icon="{icon_attr}" android:theme="@style/AppTheme" android:usesCleartextTraffic="true"><provider android:name="androidx.core.content.FileProvider" android:authorities="{pkg}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/></provider><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="{ori}" android:windowSoftInputMode="adjustResize" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')

          # escape characters that break Android strings.xml (apostrophe, quotes, &, <, @, ?)
          nm = app["name"].replace("&", "&amp;").replace("<", "&lt;").replace("'", "\\'").replace('"', '\\"')
          if nm.startswith('@') or nm.startswith('?'): nm = '\\' + nm
          with open('app/src/main/res/values/strings.xml', 'w') as f:
              f.write(f'<resources><string name="app_name">{nm}</string></resources>')
          with open('app/src/main/res/values/themes.xml', 'w') as f:
              f.write(f'<resources><style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"><item name="android:statusBarColor">{app["theme_color"]}</item><item name="android:navigationBarColor">{app.get("nav_color","#ffffff")}</item><item name="android:windowBackground">{app["splash_color"]}</item></style></resources>')

          os.makedirs('app/src/main/res/xml', exist_ok=True)
          with open('app/src/main/res/xml/file_paths.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?><paths><cache-path name="updates" path="updates/"/></paths>')

          # Where the app checks for updates (change this domain/folder if your update.php lives elsewhere)
          UPDATE_DEFAULT = 'https://nazmul.page.gd/my_profile/update.php?pkg='
          upd_url = app.get('update_url') or (UPDATE_DEFAULT + pkg)

          cs = app.get('custom', {})
          jstr = lambda s: json.dumps(s)
          java_code = """package @@PKG@@;
          import android.annotation.SuppressLint;import android.content.Intent;import android.graphics.Color;import android.net.Uri;import android.os.*;import android.view.*;import android.webkit.*;import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import androidx.appcompat.app.AlertDialog;import androidx.core.content.FileProvider;import android.provider.Settings;import java.io.ByteArrayOutputStream;import java.io.File;import java.io.FileOutputStream;import java.io.InputStream;import java.net.HttpURLConnection;import java.net.URL;import org.json.JSONObject;
          public class MainActivity extends AppCompatActivity{
           static final String START=@@START@@;static final String OFFLINE=@@OFF@@;static final String UA=@@UA@@;static final boolean EXT=@@EXT@@;static final String UPD=@@UPD@@;
           static final String T_TITLE=@@T_TITLE@@,T_MSG=@@T_MSG@@,T_BTN=@@T_BTN@@,T_LATER=@@T_LATER@@,T_DL=@@T_DL@@,T_ERR=@@T_ERR@@,T_PERM=@@T_PERM@@;
           WebView web;WebView splash;SwipeRefreshLayout sw;TextView off;ValueCallback<Uri[]> cb;String pending;
           @SuppressLint("SetJavaScriptEnabled") @Override protected void onCreate(Bundle b){
            super.onCreate(b);
            if(@@FULL@@){getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,WindowManager.LayoutParams.FLAG_FULLSCREEN);
             if(Build.VERSION.SDK_INT>=28){WindowManager.LayoutParams lp=getWindow().getAttributes();lp.layoutInDisplayCutoutMode=WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;getWindow().setAttributes(lp);}
             getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_STABLE|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);}
            FrameLayout root=new FrameLayout(this);sw=new SwipeRefreshLayout(this);web=new WebView(this);sw.addView(web);root.addView(sw);
            sw.setEnabled(@@PULL@@);sw.setOnRefreshListener(()->{off.setVisibility(View.GONE);web.reload();});sw.setOnChildScrollUpCallback((p,c)->web.getScrollY()>0);
            off=new TextView(this);off.setText(OFFLINE);off.setGravity(Gravity.CENTER);off.setPadding(60,60,60,60);off.setTextSize(17);off.setBackgroundColor(Color.WHITE);off.setTextColor(Color.DKGRAY);off.setVisibility(View.GONE);
            off.setOnClickListener(v->{off.setVisibility(View.GONE);web.reload();});root.addView(off);
            splash=new WebView(this);splash.getSettings().setJavaScriptEnabled(false);splash.setBackgroundColor(Color.TRANSPARENT);splash.loadUrl("file:///android_asset/splash.html");root.addView(splash);
            setContentView(root);
            WebSettings s=web.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setMediaPlaybackRequiresUserGesture(false);s.setGeolocationEnabled(true);s.setAllowFileAccess(false);
            if(UA.length()>0)s.setUserAgentString(s.getUserAgentString()+" "+UA);
            if(@@ZOOM@@){s.setSupportZoom(true);s.setBuiltInZoomControls(true);s.setDisplayZoomControls(false);}
            CookieManager.getInstance().setAcceptCookie(true);CookieManager.getInstance().setAcceptThirdPartyCookies(web,true);
            web.setWebViewClient(new WebViewClient(){
             @Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){Uri u=r.getUrl();String sc=u.getScheme()==null?"":u.getScheme();
              if(sc.equals("http")||sc.equals("https")){if(EXT&&u.getHost()!=null&&!u.getHost().equals(Uri.parse(START).getHost())){try{startActivity(new Intent(Intent.ACTION_VIEW,u));}catch(Exception e){}return true;}return false;}
              try{startActivity(new Intent(Intent.ACTION_VIEW,u));}catch(Exception e){}return true;}
             @Override public void onPageFinished(WebView v,String u){sw.setRefreshing(false);}
             @Override public void onReceivedError(WebView v,WebResourceRequest r,WebResourceError e){if(r.isForMainFrame()){sw.setRefreshing(false);off.setVisibility(View.VISIBLE);}}
            });
            web.setWebChromeClient(new WebChromeClient(){
             @Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> c,FileChooserParams p){if(cb!=null)cb.onReceiveValue(null);cb=c;try{startActivityForResult(p.createIntent(),1);}catch(Exception e){cb=null;return false;}return true;}
             @Override public void onGeolocationPermissionsShowPrompt(String o,GeolocationPermissions.Callback c){c.invoke(o,true,false);}
             @Override public void onPermissionRequest(PermissionRequest r){runOnUiThread(()->r.grant(r.getResources()));}
            });
            web.setDownloadListener((u,ua,cd,mt,l)->{try{startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(u)));}catch(Exception e){}});
            String[] P=new String[]{@@PERMS@@};if(Build.VERSION.SDK_INT>=23&&P.length>0)requestPermissions(P,2);
            web.loadUrl(START);checkUpdate();
            new Handler(Looper.getMainLooper()).postDelayed(()->splash.setVisibility(View.GONE),@@DUR@@);
           }
           void checkUpdate(){if(UPD.length()==0)return;new Thread(()->{try{HttpURLConnection c=(HttpURLConnection)new URL(UPD).openConnection();c.setConnectTimeout(8000);c.setReadTimeout(8000);if(c.getResponseCode()!=200)return;InputStream in=c.getInputStream();ByteArrayOutputStream bo=new ByteArrayOutputStream();byte[] bf=new byte[4096];int n;while((n=in.read(bf))>0)bo.write(bf,0,n);in.close();JSONObject j=new JSONObject(bo.toString("UTF-8"));int cur=getPackageManager().getPackageInfo(getPackageName(),0).versionCode;if(j.optInt("versionCode",0)<=cur)return;final String ver=j.optString("versionName","");final String nt=j.optString("notes","");final String link=j.optString("url","");final boolean fc=j.optBoolean("force",false);if(link.length()==0)return;runOnUiThread(()->showUpdate(ver,nt,link,fc));}catch(Exception e){}}).start();}
           void showUpdate(String ver,String nt,String link,boolean fc){AlertDialog.Builder bd=new AlertDialog.Builder(this).setTitle(T_TITLE+(ver.length()>0?" ("+ver+")":"")).setMessage(nt.length()>0?nt:T_MSG).setCancelable(!fc).setPositiveButton(T_BTN,(d,w)->startUpdate(link));if(!fc)bd.setNegativeButton(T_LATER,null);bd.show();}
           void startUpdate(String link){if(Build.VERSION.SDK_INT>=26&&!getPackageManager().canRequestPackageInstalls()){pending=link;Toast.makeText(this,T_PERM,Toast.LENGTH_LONG).show();try{startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,Uri.parse("package:"+getPackageName())));}catch(Exception e){}return;}
            final AlertDialog dl=new AlertDialog.Builder(this).setTitle(T_DL).setMessage("0%").setCancelable(false).create();dl.show();
            new Thread(()->{try{File dir=new File(getCacheDir(),"updates");dir.mkdirs();final File f=new File(dir,"update.apk");HttpURLConnection c=(HttpURLConnection)new URL(link).openConnection();c.setConnectTimeout(15000);c.setReadTimeout(30000);c.setInstanceFollowRedirects(true);c.connect();int len=c.getContentLength();InputStream in=c.getInputStream();FileOutputStream o=new FileOutputStream(f);byte[] bf=new byte[16384];int n;long t=0;int last=-1;while((n=in.read(bf))>0){o.write(bf,0,n);t+=n;if(len>0){final int p=(int)(t*100/len);if(p!=last){last=p;runOnUiThread(()->dl.setMessage(p+"%"));}}}o.close();in.close();runOnUiThread(()->{dl.dismiss();try{Uri u=FileProvider.getUriForFile(this,getPackageName()+".fileprovider",f);Intent i=new Intent(Intent.ACTION_VIEW);i.setDataAndType(u,"application/vnd.android.package-archive");i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_ACTIVITY_NEW_TASK);startActivity(i);}catch(Exception e){Toast.makeText(this,T_ERR,Toast.LENGTH_LONG).show();}});}catch(Exception e){runOnUiThread(()->{dl.dismiss();Toast.makeText(this,T_ERR,Toast.LENGTH_LONG).show();});}}).start();}
           @Override protected void onResume(){super.onResume();if(pending!=null&&(Build.VERSION.SDK_INT<26||getPackageManager().canRequestPackageInstalls())){String pl=pending;pending=null;startUpdate(pl);}}
           @Override protected void onActivityResult(int rq,int rs,Intent d){if(rq==1&&cb!=null){cb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rs,d));cb=null;}else super.onActivityResult(rq,rs,d);}
           @Override public void onBackPressed(){if(web.canGoBack())web.goBack();else super.onBackPressed();}
          }"""
          java_code = java_code.replace('@@PKG@@', pkg).replace('@@START@@', jstr(app.get('start_url') or app['url']))
          java_code = java_code.replace('@@OFF@@', jstr(app.get('offline_msg') or 'No internet connection'))
          java_code = java_code.replace('@@UA@@', jstr(cs.get('user_agent', ''))).replace('@@EXT@@', 'true' if cs.get('external') else 'false')
          java_code = java_code.replace('@@FULL@@', 'true' if app.get('fullscreen') else 'false')
          java_code = java_code.replace('@@PULL@@', 'true' if app.get('pull_refresh') else 'false')
          java_code = java_code.replace('@@ZOOM@@', 'true' if cs.get('zoom') else 'false')
          java_code = java_code.replace('@@DUR@@', str(int(app['loader']['duration']) * 1000))
          java_code = java_code.replace('@@PERMS@@', rt_str)
          java_code = java_code.replace('@@UPD@@', jstr(upd_url))
          tx = {
              'T_TITLE': 'নতুন আপডেট এসেছে',
              'T_MSG': 'অ্যাপের নতুন সংস্করণ পাওয়া যাচ্ছে। এখনই আপডেট করুন।',
              'T_BTN': 'আপডেট করুন',
              'T_LATER': 'পরে',
              'T_DL': 'ডাউনলোড হচ্ছে...',
              'T_ERR': 'ডাউনলোড ব্যর্থ হয়েছে, আবার চেষ্টা করুন',
              'T_PERM': 'ইনস্টলের অনুমতি দিন, তারপর ফিরে আসুন',
          }
          for k, v in tx.items():
              java_code = java_code.replace('@@' + k + '@@', jstr(v))

          os.makedirs(f"app/src/main/java/{pkg.replace('.', '/')}", exist_ok=True)
          with open(f"app/src/main/java/{pkg.replace('.', '/')}/MainActivity.java", 'w') as f:
              f.write(java_code)
          EOF
          python3 gen_code.py

      - name: 6. Compiling Android Resources
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 6b. Preparing Signing Key
        working-directory: workspace
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Permanent keystore found - signing with your own key"
          else
            echo "WARNING: KEYSTORE_BASE64 secret missing - using a temporary key (in-app updates will NOT install over older versions)"
          fi

      - name: 7. Running Gradle Build
        working-directory: workspace
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          B_MODE=$(python3 -c "import re;m=re.search(r'\"build_type\"\s*:\s*\"([^\"]*)\"',open('config.json').read());print(m.group(1).lower() if m else 'debug')" 2>/dev/null || echo "debug")
          if [ "$B_MODE" = "release" ]; then TARGET="Release"; else TARGET="Debug"; fi
          echo "Build mode: $TARGET"

          TYPE="${{ github.event.inputs.type }}"
          : > ../gradle.log
          FAILED=0

          if [ "$TYPE" = "apk" ] || [ "$TYPE" = "both" ]; then
            ./gradlew assemble$TARGET --no-daemon --stacktrace 2>&1 | tee -a ../gradle.log
            [ "${PIPESTATUS[0]}" -eq 0 ] || FAILED=1
          fi
          if [ $FAILED -eq 0 ] && { [ "$TYPE" = "aab" ] || [ "$TYPE" = "both" ]; }; then
            ./gradlew bundle$TARGET --no-daemon --stacktrace 2>&1 | tee -a ../gradle.log
            [ "${PIPESTATUS[0]}" -eq 0 ] || FAILED=1
          fi

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "=================== ERROR SUMMARY ==================="
            grep -n -E -A12 "What went wrong|error:|AAPT|Execution failed" ../gradle.log | head -80
            exit 1
          fi

      - name: 8. Generating APK / AAB
        working-directory: workspace
        run: |
          mkdir -p ../dist
          find app/build/outputs -type f -name "*.apk" -exec cp {} ../dist/ \; || true
          find app/build/outputs -type f -name "*.aab" -exec cp {} ../dist/ \; || true
          ls -la ../dist/

      - name: 9. Signing Application
        run: echo "Verified application signing"

      - name: 10. Verifying Build Output
        run: |
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "Error: No APK or AAB files generated!"
            exit 1
          fi

      - name: 11. Preparing Download File
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.event.inputs.build_id }}
          name: Build #${{ github.event.inputs.build_id }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Temporary Files
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rf builds/${{ github.event.inputs.build_id }} || true
          git commit -m "Clean build #${{ github.event.inputs.build_id }}" || true
          git push || true
