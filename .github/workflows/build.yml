name: APK Builder Engine
run-name: build-${{ github.event.inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build ID'
        required: true
      type:
        description: 'Build Format'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 1. Initializing Build Environment
        uses: actions/checkout@v4

      - name: 2. Validating Application Settings
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Preparing Android Project
        run: |
          mkdir -p workspace
          cp builds/${{ github.event.inputs.build_id }}/config.json workspace/config.json || true
          cp builds/${{ github.event.inputs.build_id }}/icon.png workspace/icon.png || true
          cp builds/${{ github.event.inputs.build_id }}/splash.png workspace/splash.png || true

          cd workspace
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cat << 'EOF' > generate_base.py
          import json, os, sys
          if not os.path.exists('config.json'):
              print("No config.json found")
              sys.exit(1)
          with open('config.json') as f: cfg = json.load(f)
          a = cfg['app']
          pkg = a['package']
          min_sdk = max(21, int(a.get('min_sdk', 21)))
          target_sdk = max(36, int(a.get('target_sdk', 36)))   # Google Play requires API 36+

          with open("settings.gradle", "w") as f:
              f.write("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n")
              f.write("dependencyResolutionManagement { repositories { google(); mavenCentral() } }\n")
              f.write("rootProject.name='webapp'\ninclude ':app'\n")

          with open("build.gradle", "w") as f:
              f.write("plugins { id 'com.android.application' version '8.9.1' apply false }\n")

          with open("gradle.properties", "w") as f:
              f.write("org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8\n")
              f.write("android.useAndroidX=true\n")
              f.write("android.nonTransitiveRClass=true\n")
              f.write("android.suppressUnsupportedCompileSdk=36\n")

          lines = [
              "plugins {",
              "    id 'com.android.application'",
              "}",
              "",
              "android {",
              "    namespace '%s'" % pkg,
              "    compileSdk 36",
              "",
              "    defaultConfig {",
              "        applicationId '%s'" % pkg,
              "        minSdk %d" % min_sdk,
              "        targetSdk %d" % target_sdk,
              "        versionCode %d" % int(a['version_code']),
              "        versionName '%s'" % a['version_name'],
              "    }",
              "",
              "    signingConfigs {",
              "        permanent {",
              "            if (System.getenv('KEYSTORE_PATH')) {",
              "                storeFile file(System.getenv('KEYSTORE_PATH'))",
              "                storePassword System.getenv('KEYSTORE_PASSWORD')",
              "                keyAlias System.getenv('KEY_ALIAS')",
              "                keyPassword System.getenv('KEY_PASSWORD')",
              "                if (System.getenv('KEYSTORE_TYPE')) { storeType System.getenv('KEYSTORE_TYPE') }",
              "            }",
              "        }",
              "    }",
              "",
              "    buildTypes {",
              "        release {",
              "            minifyEnabled false",
              "            signingConfig System.getenv('KEYSTORE_PATH') ? signingConfigs.permanent : signingConfigs.debug",
              "        }",
              "        debug {",
              "            signingConfig System.getenv('KEYSTORE_PATH') ? signingConfigs.permanent : signingConfigs.debug",
              "        }",
              "    }",
              "",
              "    lint {",
              "        abortOnError false",
              "        checkReleaseBuilds false",
              "    }",
              "",
              "    compileOptions {",
              "        sourceCompatibility JavaVersion.VERSION_17",
              "        targetCompatibility JavaVersion.VERSION_17",
              "    }",
              "}",
              "",
              "dependencies {",
              "    implementation 'androidx.appcompat:appcompat:1.6.1'",
              "    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'",
              "}",
              "",
          ]
          with open("app/build.gradle", "w") as f:
              f.write("\n".join(lines))
          EOF
          python3 generate_base.py

          # Generate Gradle wrapper (8.11.1 is the minimum for AGP 8.9.1, needed for API 36)
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x ./gradlew

      - name: 4. Processing App Icon & Splash Screen
        working-directory: workspace
        run: |
          pip install pillow -q --break-system-packages || pip install pillow -q || true
          cat << 'EOF' > icon_splash.py
          import json, os, shutil
          try:
              from PIL import Image
          except Exception:
              Image = None

          with open('config.json') as f: cfg = json.load(f)
          assets = 'app/src/main/assets'
          os.makedirs(assets, exist_ok=True)

          # splash page (HTML) shown on app start
          with open(assets + '/splash.html', 'w', encoding='utf-8') as f:
              f.write(cfg['app']['loader']['html'])

          def save_png(src, dst, max_side):
              ok = False
              if Image:
                  try:
                      im = Image.open(src).convert('RGBA')
                      im.thumbnail((max_side, max_side))
                      im.save(dst, 'PNG')
                      ok = True
                  except Exception as e:
                      print('Image convert failed:', src, e)
              if not ok:
                  shutil.copy(src, dst)

          # ---- app (launcher) icon ----
          dst = 'app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'
          if os.path.exists('icon.png'):
              os.makedirs('app/src/main/res/mipmap-xxxhdpi', exist_ok=True)
              save_png('icon.png', dst, 512)
              # splash.html loads icon.png from assets
              shutil.copy(dst, assets + '/icon.png')
          else:
              os.makedirs('app/src/main/res/drawable', exist_ok=True)
              color = cfg['app'].get('theme_color', '#0d9488')
              with open('app/src/main/res/drawable/ic_launcher.xml', 'w') as f:
                  f.write('<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="' + color + '"/><corners android:radius="24dp"/></shape>')

          # ---- optional splash image (splash.html loads splash_img.png from assets) ----
          if os.path.exists('splash.png'):
              save_png('splash.png', assets + '/splash_img.png', 1280)
          EOF
          python3 icon_splash.py
          ls -la app/src/main/assets

      - name: 5. Configuring Android Permissions
        working-directory: workspace
        run: |
          cat << 'EOF' > gen_code.py
          import json, os
          with open('config.json') as f: cfg = json.load(f)
          app = cfg['app']
          pkg = app['package']

          # REQUEST_INSTALL_PACKAGES: needed for the in-app update installer
          perms = ['INTERNET', 'ACCESS_NETWORK_STATE', 'REQUEST_INSTALL_PACKAGES']
          pm_map = {'camera':['CAMERA'],'location':['ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION'],'storage':['READ_EXTERNAL_STORAGE','READ_MEDIA_IMAGES'],'mic':['RECORD_AUDIO','MODIFY_AUDIO_SETTINGS'],'notifications':['POST_NOTIFICATIONS']}
          for p in app.get('permissions', []): perms.extend(pm_map.get(p, []))
          pm_str = ''.join([f'<uses-permission android:name="android.permission.{p}"/>' for p in perms])
          # runtime permission request list (REQUEST_INSTALL_PACKAGES is not a runtime permission)
          rt_perms = [p for p in perms if p != 'REQUEST_INSTALL_PACKAGES']
          rt_str = ','.join([f'"android.permission.{p}"' for p in rt_perms])
          ori = {'auto':'unspecified','portrait':'portrait','landscape':'landscape'}.get(app.get('orientation', 'auto'), 'unspecified')

          icon_attr = '@mipmap/ic_launcher' if os.path.exists('app/src/main/res/mipmap-xxxhdpi/ic_launcher.png') else '@drawable/ic_launcher'

          with open('app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(f'<manifest xmlns:android="http://schemas.android.com/apk/res/android">{pm_str}<application android:label="@string/app_name" android:icon="{icon_attr}" android:theme="@style/AppTheme" android:usesCleartextTraffic="true"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="{ori}" android:windowSoftInputMode="adjustResize" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><provider android:name="androidx.core.content.FileProvider" android:authorities="{pkg}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/></provider></application></manifest>')

          # FileProvider paths (the downloaded update APK is kept in the cache dir)
          os.makedirs('app/src/main/res/xml', exist_ok=True)
          with open('app/src/main/res/xml/file_paths.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?><paths><external-files-path name="dl" path="."/><files-path name="fp" path="."/><cache-path name="cp" path="."/></paths>')

          # escape characters that break Android strings.xml (apostrophe, quotes, &, <, @, ?)
          nm = app["name"].replace("&", "&amp;").replace("<", "&lt;").replace("'", "\\'").replace('"', '\\"')
          if nm.startswith('@') or nm.startswith('?'): nm = '\\' + nm
          with open('app/src/main/res/values/strings.xml', 'w') as f:
              f.write(f'<resources><string name="app_name">{nm}</string></resources>')
          with open('app/src/main/res/values/themes.xml', 'w') as f:
              f.write(f'<resources><style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:statusBarColor">{app["theme_color"]}</item><item name="android:navigationBarColor">{app.get("nav_color","#ffffff")}</item><item name="android:windowBackground">{app["splash_color"]}</item></style></resources>')

          cs = app.get('custom', {})
          jstr = lambda s: json.dumps(s)
          java_code = """package @@PKG@@;
          import android.annotation.SuppressLint;import android.content.Intent;import android.graphics.Color;import android.net.Uri;import android.os.*;import android.view.*;import android.webkit.*;import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import android.content.pm.PackageInfo;import java.io.File;import java.io.FileOutputStream;import java.io.IOException;import java.io.InputStream;import java.net.HttpURLConnection;import java.net.URL;import org.json.JSONObject;import androidx.core.content.FileProvider;
          public class MainActivity extends AppCompatActivity{
