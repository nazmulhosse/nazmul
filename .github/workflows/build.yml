      - name: 6. Compiling Android Resources
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 platforms;android-35 build-tools;36.0.0 build-tools;35.0.0'

      - name: 6b. Preparing Signing Key
        env:
          ENC_SECRET: ${{ secrets.BUILD_ENC_KEY }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          # Permanent per-app key only. NO temporary/debug fallback: a build that cannot use its key must fail,
          # otherwise the APK could not update the previously installed version.
          if [ -z "$ENC_SECRET" ]; then
            echo "::error::GitHub Secret BUILD_ENC_KEY is not set (must equal GH_SIGN_SECRET in apk_builder.php)."
            exit 1
          fi
          if [ ! -f "builds/$BUILD_ID/signing.enc" ]; then
            echo "::error::builds/$BUILD_ID/signing.enc missing - the panel did not send the signing key. Refusing to build with a temporary key."
            exit 1
          fi
          pip install cryptography -q --break-system-packages || pip install cryptography -q || true
          cat << 'EOF' > /tmp/prep_sign.py
          import os, sys, json, base64, hashlib, subprocess
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          raw = base64.b64decode(open('builds/%s/signing.enc' % os.environ['BUILD_ID']).read().strip())
          iv, tag, ct = raw[:12], raw[12:28], raw[28:]
          try:
              d = json.loads(AESGCM(hashlib.sha256(os.environ['ENC_SECRET'].encode()).digest()).decrypt(iv, ct + tag, None))
          except Exception:
              print('::error::signing.enc could not be decrypted - BUILD_ENC_KEY does not match GH_SIGN_SECRET in apk_builder.php')
              sys.exit(1)
          for k in ('store_pass', 'key_pass'):
              if '\n' in d[k] or '\r' in d[k]:
                  print('::error::keystore password contains a line break'); sys.exit(1)
              print('::add-mask::' + d[k])
          ks = os.path.join(os.environ['RUNNER_TEMP'], 'release.keystore')
          with open(ks, 'wb') as f: f.write(base64.b64decode(d['ks']))
          r = subprocess.run(['keytool', '-list', '-v', '-keystore', ks, '-storetype', d['type'], '-storepass', d['store_pass'], '-alias', d['alias']], capture_output=True, text=True)
          fp = ''
          for line in r.stdout.splitlines():
              if 'SHA256:' in line:
                  fp = line.split('SHA256:')[1].strip().replace(':', '').lower(); break
          if r.returncode != 0 or not fp:
              print('::error::keystore could not be opened or alias not found (type=%s, alias=%s)' % (d['type'], d['alias']))
              print(r.stdout[-600:]); print(r.stderr[-600:]); sys.exit(1)
          print('Permanent signing key loaded. Keystore certificate SHA-256: ' + fp)
          with open(os.environ['GITHUB_ENV'], 'a') as g:
              g.write('KEYSTORE_PATH=%s\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\nKEYSTORE_TYPE=%s\nEXPECTED_SHA256=%s\n' % (ks, d['store_pass'], d['alias'], d['key_pass'], d['type'], fp))
          EOF
          python3 /tmp/prep_sign.py
          rm -f /tmp/prep_sign.py

      - name: 7. Running Gradle Build
        working-directory: workspace
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          B_MODE=$(python3 -c "import re;m=re.search(r'\"build_type\"\s*:\s*\"([^\"]*)\"',open('config.json').read());print(m.group(1).lower() if m else 'debug')" 2>/dev/null || echo "debug")
          if [ "$B_MODE" = "release" ]; then TARGET="Release"; else TARGET="Debug"; fi
          echo "Build mode: $TARGET"

          TYPE="${{ github.event.inputs.type }}"
          : > ../gradle.log
          FAILED=0

          if [ "$TYPE" = "apk" ] || [ "$TYPE" = "both" ]; then
            ./gradlew assemble$TARGET --no-daemon --stacktrace 2>&1 | tee -a ../gradle.log
            [ "${PIPESTATUS[0]}" -eq 0 ] || FAILED=1
          fi
          if [ $FAILED -eq 0 ] && { [ "$TYPE" = "aab" ] || [ "$TYPE" = "both" ]; }; then
            ./gradlew bundle$TARGET --no-daemon --stacktrace 2>&1 | tee -a ../gradle.log
            [ "${PIPESTATUS[0]}" -eq 0 ] || FAILED=1
          fi

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "=================== ERROR SUMMARY ==================="
            grep -n -E -A12 "What went wrong|error:|AAPT|Execution failed" ../gradle.log | head -80
            exit 1
          fi

      - name: 8. Generating APK / AAB
        working-directory: workspace
        run: |
          mkdir -p ../dist
          find app/build/outputs -type f -name "*.apk" -exec cp {} ../dist/ \; || true
          find app/build/outputs -type f -name "*.aab" -exec cp {} ../dist/ \; || true
          ls -la ../dist/

      - name: 9. Signing Application
        run: |
          # Verify every output is signed by the permanent key (same certificate = users can update in place)
          norm() { tr -d ': \n\r' | tr 'A-F' 'a-f'; }
          FOUND=0
          for f in dist/*.apk; do
            [ -f "$f" ] || continue
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$f" > /tmp/cert.txt 2>&1 || { cat /tmp/cert.txt; echo "::error::apksigner verification failed for $f"; exit 1; }
            GOT=$(grep -m1 'certificate SHA-256 digest' /tmp/cert.txt | awk -F': ' '{print $2}' | norm)
            echo "$f -> signer SHA-256: $GOT"
            if [ -z "$GOT" ] || [ "$GOT" != "$EXPECTED_SHA256" ]; then
              echo "::error::Signing certificate does NOT match the permanent keystore (expected $EXPECTED_SHA256). This APK would not update the installed app."
              exit 1
            fi
            FOUND=1
          done
          for f in dist/*.aab; do
            [ -f "$f" ] || continue
            GOT=$(keytool -printcert -jarfile "$f" 2>/dev/null | grep -m1 'SHA256:' | awk -F'SHA256:' '{print $2}' | norm)
            echo "$f -> signer SHA-256: $GOT"
            if [ -n "$GOT" ] && [ "$GOT" != "$EXPECTED_SHA256" ]; then
              echo "::error::AAB signing certificate does NOT match the permanent keystore."
              exit 1
            fi
            FOUND=1
          done
          [ "$FOUND" -eq 1 ] || { echo "::error::No APK/AAB to verify"; exit 1; }
          echo "OK: signed with the permanent key (SHA-256 $EXPECTED_SHA256)"

      - name: 10. Verifying Build Output
        run: |
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "Error: No APK or AAB files generated!"
            exit 1
          fi

      - name: 11. Preparing Download File
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.event.inputs.build_id }}
          name: Build #${{ github.event.inputs.build_id }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Temporary Files
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rf builds/${{ github.event.inputs.build_id }} || true
          git commit -m "Clean build #${{ github.event.inputs.build_id }}" || true
          git push || true
