          java_code = java_code.replace('@@THEME@@', jstr(app['theme_color'])).replace('@@PKG@@', pkg).replace('@@START@@', jstr(app.get('start_url') or app['url']))
          java_code = java_code.replace('@@OFF@@', jstr(app.get('offline_msg') or 'No internet connection'))
